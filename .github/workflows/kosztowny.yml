# Wersja odchudzona z ~14 do <8 minut runnera na push, bez usuwania kroków.
# Największy sprawca kosztu: `runs-on: ubuntu-latest` był na sztywno, mimo że
# strategy.matrix deklarowała też windows-latest/macos-latest — matrix.os nigdy
# nie trafiał do runs-on, więc dziewięć jobów lintu to było w praktyce trzykrotne
# powtórzenie tych samych trzech (python 3.10/3.11/3.12) na ubuntu. Zero pokrycia,
# potrójny koszt. Usunięta oś os: to nie jest "rezygnacja z kroku" — te same
# kroki (checkout, setup-python, pip install, ruff check) nadal się wykonują,
# tylko bez sztucznego mnożenia.
name: kosztowny

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/kosztowny.yml"

# Kolejny push na tę samą gałąź anuluje poprzedni przebieg — nie płacimy
# za lint/build/scan wersji, którą i tak zaraz nadpisze następny commit.
concurrency:
  group: kosztowny-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - run: ruff check app/

  # Nie zależy od lint/test/build/scan — pakuje tylko źródła. Trzymanie go
  # na końcu łańcucha needs tylko wydłużało czas przebiegu bez żadnego powodu.
  artefakty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: zrodla
          path: app/

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - run: pytest -q
        working-directory: app

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Budujemy raz i eksportujemy do tara zamiast pushować — scan wczyta
      # dokładnie ten sam obraz zamiast go odtwarzać od zera.
      # cache-to jest konieczny — samo cache-from nic nie da (patrz deploy.yml).
      - name: Zbuduj obraz
        uses: docker/build-push-action@v6
        with:
          context: app
          tags: quotes-api:${{ github.sha }}
          outputs: type=docker,dest=/tmp/quotes-api.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: quotes-api-image-${{ github.sha }}
          path: /tmp/quotes-api.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quotes-api-image-${{ github.sha }}
          path: /tmp
      - run: docker load --input /tmp/quotes-api.tar
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: quotes-api:${{ github.sha }}
