# Strażnik promptów — krok wpinany PRZED wywołaniem modelu, w tym samym jobie.
#
# Prompt czytamy z pliku, a nie z inputu: wartości inputów i `env:` GitHub wypisuje
# w nagłówku kroku, więc sekret z promptu trafiłby do logów CI — dokładnie to,
# przed czym ten krok ma chronić.
#
# `permissions:` i `timeout-minutes` ustawia job, który wywołuje akcję (composite
# action nie może ich mieć). Pierwsze uruchomienie w trybie pełnym pobiera model
# PromptInjection (kilkaset MB) — daj jobowi co najmniej 20 minut.
name: straznik-promptu
description: Odrzuca prompt z próbą prompt injection albo sekretem, zanim trafi do modelu

inputs:
  plik-promptu:
    description: Ścieżka do pliku z treścią promptu, względem katalogu roboczego
    required: true
  pelny:
    description: "true = dołącz skaner PromptInjection (model z Hugging Face)"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: .github/actions/straznik-promptu/requirements.txt

    # Model PromptInjection w cache — bez tego każdy run pobiera go od nowa.
    - if: inputs.pelny == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-llm-guard-${{ hashFiles('.github/actions/straznik-promptu/requirements.txt') }}

    - name: Zainstaluj llm-guard
      shell: bash
      run: pip install -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Sprawdź prompt
      shell: bash
      env:
        PLIK_PROMPTU: ${{ inputs.plik-promptu }}
        PELNY: ${{ inputs.pelny }}
      run: |
        if [ ! -s "$PLIK_PROMPTU" ]; then
          echo "::error::Brak pliku z promptem albo plik jest pusty: $PLIK_PROMPTU"
          exit 1
        fi
        flagi=()
        [ "$PELNY" = "true" ] && flagi+=(--pelny)
        # Logi llm-guard zawierają typ wykrycia i wynik skanera, nigdy treść promptu.
        # Kod wyjścia 1 przerywa job, a krok wysyłający prompt do modelu się nie wykona.
        python "$GITHUB_ACTION_PATH/straznik.py" "${flagi[@]}" < "$PLIK_PROMPTU"
